sites:
  - site_id: colombo-plant-1
    name: Colombo Plant 1
    latitude: 6.9271
    longitude: 79.8612
    timezone: Asia/Colombo
    connected_load_kw: 250
    solar_kwp: 100
    # Replace with your Telegram GROUP chat id (a negative number). Get it by adding the bot to
    # the group, posting a message, then reading `result[].message.chat.id` from
    #   curl "https://api.telegram.org/bot<TOKEN>/getUpdates"
    telegram_chat_id: -1000000000001
    tariff:
      # Energy charges (LKR/kWh), indicative of the CEB General Purpose 2 (GP-2) Time-of-Use
      # schedule effective October 2025. Verify against the current PUCSL/CEB gazette before a
      # production deployment. Band *times* follow the CEB TOU schedule and live in
      # data/sites.py; only the rates live here.
      peak_lkr_per_kwh: 70.0
      day_lkr_per_kwh: 45.0
      offpeak_lkr_per_kwh: 32.0
    calendar:
      working_days: [mon, tue, wed, thu, fri, sat]
      closed_dates: ["2026-08-25"]
    thresholds:
      baseload_creep_pct: 15
      baseload_creep_min_kw: 2
      solar_yield_floor_pct: 75
      off_schedule_load_pct: 40

  - site_id: kandy-hotel-1
    name: Kandy Hotel 1
    latitude: 7.2906
    longitude: 80.6337
    timezone: Asia/Colombo
    connected_load_kw: 120
    solar_kwp: 0
    telegram_chat_id: -1000000000002
    tariff:
      peak_lkr_per_kwh: 70.0
      day_lkr_per_kwh: 45.0
      offpeak_lkr_per_kwh: 32.0
    calendar:
      # A hotel runs seven days a week and never books a closed date, so nothing here can trip
      # the off-schedule detector — this site exists to prove a healthy site stays silent.
      working_days: [mon, tue, wed, thu, fri, sat, sun]
      closed_dates: []
    thresholds:
      baseload_creep_pct: 15
      baseload_creep_min_kw: 2
      solar_yield_floor_pct: 75
      off_schedule_load_pct: 40
